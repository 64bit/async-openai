[package]
name = "realtime-audio"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-openai = { path = "../../async-openai", features = ["realtime"] }
futures-util = { version = "0.3", features = ["sink", "std"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["connect", "native-tls"] }
base64 = "0.23.1"
hound = "3.5"
